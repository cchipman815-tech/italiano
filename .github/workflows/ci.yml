name: CI

# Guards the branch that production is built from. Deliberately scoped to
# typecheck + tests: both run in seconds and need no secrets. The Next.js
# production build is not repeated here — Vercel already builds on every
# deploy, and reproducing it in CI would mean giving Actions the Supabase,
# Google and Anthropic keys for no extra signal.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck & tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Vercel's current default runtime, and what this Mac runs.
          node-version: '24'
          cache: npm

      # `ci` not `install`: fails loudly if package-lock.json has drifted from
      # package.json, rather than silently resolving something different.
      - run: npm ci

      - run: npm run typecheck

      - run: npm test
